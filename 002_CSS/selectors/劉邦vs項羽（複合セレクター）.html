<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            padding: 8px 12px;
            border: none;
        }

        .small {
            font-size: 12px;
        }

        .large {
            font-size: 18px;
        }

        .warning {
            background: #f44336;
            color: white;
        }

        .success {
            background: #4caf50;
            color: white;
        }
    </style>
</head>

<body>
    <button class="btn small warning">項羽</button>
    <button class="btn large success">劉邦</button>
</body>

</html>
