<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            padding: 8px 12px;
            border-radius: 6px;
        }


        .btn.primary {
            background: blue;
            color: white;
        }

        .btn.secondary {
            background: gray;
            color: black;
        }


        .btn.large {
            font-size: 18px;
        }

        .btn.small {
            font-size: 12px;
        }
    </style>

</head>

<body>
    <button class="btn primary large">送信</button>
    <button class="btn secondary small">キャンセル</button>
</body>

</html>
