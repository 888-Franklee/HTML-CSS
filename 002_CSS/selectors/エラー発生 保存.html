<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .alert.error {
            background: red;
            color: white;
        }

        .alert.success {
            background: green;
            color: white;
        }

</head>

<body>

    <div class="alert success">保存しました</div>

</body>

</html>
